# ==============================================================================
# GrowthSpare IT Solutions - Nginx Reverse Proxy Configuration
# Django + Gunicorn + Docker Production Setup
# ==============================================================================

user nginx;

worker_processes auto;

pid /var/run/nginx.pid;


events {
    worker_connections 1024;
}


http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;


    # Performance Settings
    sendfile on;

    tcp_nopush on;

    tcp_nodelay on;

    keepalive_timeout 65;


    # Gzip Compression
    gzip on;

    gzip_vary on;

    gzip_proxied any;

    gzip_comp_level 6;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;


    # Django Gunicorn Backend
    upstream django_app {

        server web:8000;

    }


    # Main Server
    server {

        listen 80;

        listen [::]:80;


        # Accept localhost + production domain

        server_name
            localhost
            127.0.0.1
            growthspareitsolutions.com
            www.growthspareitsolutions.com;


        # Health Check

        location /ping {

            access_log off;

            proxy_pass http://django_app;

        }


        # Static Files

        location /static/ {

            alias /app/staticfiles/;

            expires 30d;

            add_header Cache-Control "public";

        }


        # Media Files

        location /media/ {

            alias /app/mediafiles/;

            expires 30d;

            add_header Cache-Control "public";

        }


        # Django Application Proxy

        location / {


            proxy_pass http://django_app;


            # Correct Host Forwarding

            proxy_set_header Host $host;


            # Client IP

            proxy_set_header X-Real-IP $remote_addr;


            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


            # Protocol

            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_redirect off;


            # Timeouts

            proxy_connect_timeout 60s;

            proxy_send_timeout 60s;

            proxy_read_timeout 60s;


            # Security Headers

            add_header X-Frame-Options "SAMEORIGIN" always;

            add_header X-Content-Type-Options "nosniff" always;

            add_header Referrer-Policy "same-origin" always;

        }

    }

}