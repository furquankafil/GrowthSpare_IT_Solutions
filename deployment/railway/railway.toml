# Railway deployment config for GrowthSpare IT Solutions
# Deploy: `railway up` from repo root, or connect the repo in the Railway dashboard.
# Add PostgreSQL and Redis via Railway's plugin marketplace, then set
# DATABASE_URL / REDIS_URL as references to those plugins in the service's
# variables tab (Railway auto-injects them if plugin names match).
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "gunicorn --config deployment/gunicorn/gunicorn.conf.py config.wsgi:application"
healthcheckPath = "/ping"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1

# Environment variables are NOT set in this file — railway.toml has no
# supported envVars key. Set the following via the Railway dashboard
# (Variables tab) or `railway variables set KEY=VALUE`:
#   DJANGO_SETTINGS_MODULE=config.settings.production
#   DEBUG=False
#   SECURE_SSL_REDIRECT=True
#   SESSION_COOKIE_SECURE=True
#   CSRF_COOKIE_SECURE=True
#   SECURE_HSTS_SECONDS=31536000
#   SECURE_HSTS_INCLUDE_SUBDOMAINS=True
#   SECURE_HSTS_PRELOAD=True
#   DATABASE_URL=<from the Postgres plugin>
#   REDIS_URL=<from the Redis plugin>
#   SECRET_KEY=<generate a real 50+ char secret>
#   ALLOWED_HOSTS=<your-app>.up.railway.app,growthspareitsolutions.com
