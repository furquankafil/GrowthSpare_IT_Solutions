# Render Blueprint for GrowthSpare IT Solutions
# Deploy: connect this repo in the Render dashboard -> "New Blueprint Instance"
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: growthspare-db
    plan: starter
    databaseName: growthspare_db
    user: growthspare_user

services:
  - type: redis
    name: growthspare-redis
    plan: starter
    ipAllowList: []  # internal-only, no external access

  - type: web
    name: growthspare-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /ping
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: growthspareitsolutions.com,www.growthspareitsolutions.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://growthspareitsolutions.com,https://www.growthspareitsolutions.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://growthspareitsolutions.com,https://www.growthspareitsolutions.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: growthspare-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: growthspare-redis
          type: redis
          property: connectionString
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
