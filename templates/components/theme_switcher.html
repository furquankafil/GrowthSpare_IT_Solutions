<!-- Reusable Premium Theme Toggle Switcher Component -->
<button id="theme-switcher-btn" 
        class="relative inline-flex items-center justify-between p-1.5 rounded-xl border border-slate-900/10 dark:border-white/10 text-slate-600 dark:text-slate-300 hover:bg-slate-500/10 focus:outline-none transition-all duration-300 group shadow-sm bg-white/50 dark:bg-slate-950/40"
        aria-label="Toggle visual theme mode (Light/Dark)">
    
    <!-- Outer visual indicators -->
    <div class="flex items-center space-x-2 px-1">
        <!-- Dark state sun icon -->
        <i class="fas fa-sun text-yellow-400 text-xs transition-transform duration-300 transform dark:scale-100 scale-0 hidden dark:block"></i>
        <!-- Light state moon icon -->
        <i class="fas fa-moon text-slate-700 text-xs transition-transform duration-300 transform dark:scale-0 scale-100 block dark:hidden"></i>
        
        <span class="text-[10px] font-bold font-poppins tracking-wider uppercase select-none">
            <span class="hidden dark:inline">Light</span>
            <span class="inline dark:hidden">Dark</span>
        </span>
    </div>
</button>

<script>
    // Self-contained localized execution fallback in case global script isn't loaded
    (function() {
        const btn = document.getElementById('theme-switcher-btn');
        if (!btn) return;

        btn.addEventListener('click', () => {
            const isDarkActive = document.documentElement.classList.contains('dark');
            
            if (isDarkActive) {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
                localStorage.setItem('theme', 'dark');
            }
        });
    })();
</script>
