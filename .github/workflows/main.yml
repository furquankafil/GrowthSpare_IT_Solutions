name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # CI-only dummy values so `manage.py check` can boot settings without a
    # local .env. These never reach production or the Render environment.
    env:
      DATABASE_URL: sqlite:///db.sqlite3
      SECRET_KEY: django-insecure-ci-dummy-key-not-for-production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Django
      run: |
        python manage.py check
