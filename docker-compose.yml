services:

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: growthspare_web

    restart: always

    command: >
      gunicorn --config deployment/gunicorn/gunicorn.conf.py
      config.wsgi:application

    env_file:
      - .env

    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/1

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://127.0.0.1:8000/ping || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


  db:
    image: postgres:16-alpine

    container_name: growthspare_db

    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

    container_name: growthspare_redis

    restart: always

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  nginx:
    image: nginx:alpine

    container_name: growthspare_nginx

    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro

    depends_on:
      - web


volumes:

  postgres_data:

  redis_data:

  static_volume:

  media_volume: